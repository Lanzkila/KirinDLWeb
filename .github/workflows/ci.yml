name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Build static site
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest server/tests -q
      - name: Build backend Docker image
        run: docker build -f server/Dockerfile -t kirindl-web-engine:test .
      - name: Smoke test backend container
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          sudo chown 10001:10001 "$data_dir"
          docker run --detach --name kirindl-web-engine-test \
            --publish 8000:8000 \
            --mount "type=bind,src=$data_dir,dst=/data" \
            kirindl-web-engine:test
          cleanup() {
            docker logs kirindl-web-engine-test || true
            docker rm --force kirindl-web-engine-test >/dev/null 2>&1 || true
            sudo rm -rf "$data_dir" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Backend container did not become healthy."
          exit 1
